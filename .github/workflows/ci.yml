name: Checks and Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} tests
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests
        run: python -m unittest -v
      - name: Verify public source archive
        run: |
          python make_portable.py
          python -c "import zipfile; z=zipfile.ZipFile('dist/WuwaRu-source.zip'); assert z.testzip() is None; assert not any('/data/' in n or '/output/' in n or n.endswith(('.pak','.sqlite3','.db','.exe')) for n in z.namelist())"

  build:
    name: Windows portable archive
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install build dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm WuwaRu.spec
      - name: Package without local game data
        run: python make_portable.py --exe dist/WuwaRu.exe --output dist/WuwaRu-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WuwaRu-windows
          path: dist/WuwaRu-windows.zip
          retention-days: 14
